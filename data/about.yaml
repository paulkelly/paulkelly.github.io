profile_text: "If you want to get me talking, ask about climbing."


main_text: "I've been making games for over 10 years as part of small teams where I've had the opportunity to work across many different areas of development.<br>

My main focus is usually gameplay. I love building the systems and features that bring a game to life, as well as adding the small details that make it feel satisfying to play.<br>

I always love getting involved with the design but I've also spent plenty of time developing tools, optimising performance, porting games to different platforms, and tackling many of the other challenges involved in bringing a game to release.<br><br><br>

Outside Work:<br>
When I'm not working I spend most of my time either climbing or playing video games & board games. I tend to like playing games that allow me to be creative and build something, some of my most played include: Kerbal Space Program, Oxygen Not included, Factorio, Satisfactory, Parkitect and World of Warcraft."
